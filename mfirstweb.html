<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {

      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      line-height: 1.6;
      background: #d2c8c8;
    }

    header {

      box-shadow:0px 4px 15px rgba(0,0,0,0.8);
     
    }

    nav a {
      color: rgb(215, 250, 249);
      text-decoration: none;

    }

    .container {
      padding: 20px; 
    }

    .section {
      margin-bottom: 30px;
      background: rgb(248, 244, 244);

      border-radius: 10px;
      box-shadow:0px 4px 15px rgba(0,0,0,0.8);

    }

    footer {
      text-align: center;
      padding: 15px;
      background: #333;
      color: white;
       box-shadow:0px 4px 15px rgba(95, 89, 89, 0.8);
    }

    @media(max-width: 600px) {
      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
